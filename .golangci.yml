version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # Best-effort fd cleanup on teardown and error paths.
        - golang.org/x/sys/unix.Close
    staticcheck:
      checks:
        - all
        # golangci-lint defaults.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Exported error strings and names are public API; keep them stable.
        - -ST1005
        - -ST1012
        # Quickfix suggestions are style hints, not defects.
        - -QF*
  exclusions:
    # Protocol packages carry "Code generated ... DO NOT EDIT."; fix the
    # scanner, not its output.
    generated: lax
    presets:
      # Close, Flush, os.Remove, fmt.Fprint*, ... results.
      - std-error-handling
    paths:
      - test/
    rules:
      # Examples (examples/ and godoc Example funcs) are demos: they skip
      # error handling to stay short.
      - path: (^examples/|_test\.go$)
        linters:
          - errcheck
          - staticcheck
          - unused
      # go/doc.Synopsis and gofumpt ExtraRules shape the generated output;
      # their replacements change it, so migrate together with a regen.
      - path: ^cmd/go-wayland-scanner/
        linters:
          - staticcheck
        text: "SA1019:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
